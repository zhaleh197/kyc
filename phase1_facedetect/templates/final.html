<script>
    let stream = null;
    let video = document.getElementById("videoFeed");
    //let processedFrame = document.getElementById("processedFrame");
    let capturedFrame = document.getElementById("capturedFrame");
    let intervalId = null;
    let lastValidFrame = null;
    let capturing = false;
    let animationId = null;
    let file=null;

function showTab(tab) {
      document.querySelectorAll('.tab-buttons button').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(div => div.classList.remove('active'));
      document.querySelector(`.tab-buttons button[onclick*="${tab}"]`).classList.add('active');
      document.getElementById(tab).classList.add('active');
    }

function startCamera() {
    navigator.mediaDevices.getUserMedia({ video: true })
    .then(mediaStream => {
      stream = mediaStream;
      video.srcObject = mediaStream;
      video.style.display = "block";
      capturedFrame.style.display = "none";
      capturing = true;
     
      sendFramesToAPI();
    })
    // .catch(err => showMsg("خطا در دسترسی به دوربین", "error"));
    .catch(err => {
      console.error("getUserMedia error:", err);
      showMsg("خطا در دسترسی به دوربین: " + err.message, "error");
    });
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  if (intervalId) {
    clearInterval(intervalId);
    intervalId = null;
  }

  if (animationId) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  // نمایش فریم نهایی
  if (lastValidFrame) {
    video.style.display = "none";
    capturedFrame.style.display = "block";
    capturedFrame.src = "data:image/jpeg;base64," + lastValidFrame;
    lastValidFrame = data.frame;
    saveImageToDB(lastValidFrame);
  }
}


function sendFramesToAPI() {
  
  let canvas = document.createElement("canvas");
  let ctx = canvas.getContext("2d", { willReadFrequently: true });
  let latestFrame = null;

  function captureFrames() {
    if (video.videoWidth && video.videoHeight) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      try {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => {
          latestFrame = blob;
        }, "image/jpeg");
      } catch (err) {
        console.error("Draw error:", err);
      }
    }

    // ذخیره کردن animationId برای توقف بعدی
    animationId = requestAnimationFrame(captureFrames);
  }

  captureFrames();

  // ذخیره کردن intervalId برای توقف بعدی
  intervalId = setInterval(() => {
    if (latestFrame) {
      let formData = new FormData();
      formData.append("frame", latestFrame, "frame.jpg");

      fetch("http://localhost:5000/process_imgSetting", {
        method: "POST",
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        if (data.warning[0] === "Face OK!") {
          lastValidFrame = latestFrame;
          showMsg("✅ صورت تأیید شد", "success");

          // // ذخیره کردن فریم فعلی
          // let reader = new FileReader();
          // reader.onloadend = () => {
          //     lastValidFrame = reader.result.split(',')[1]; // فقط بخش base64
          //     stopCamera(); // فقط وقتی فریم آماده شد
          // };
          // reader.readAsDataURL(latestFrame);



          stopCamera();  // ✅ همین‌جا دوربین رو ببند
          // video.style.display = "none"; // پنهان کردن ویدیو
          // capturedFrame.style.display = "block"; // نمایش تصویر نهایی

        } else {
          showMsgAllMessage(data.warning, "error");
        }
      })
      .catch(err => {
        console.error("API Error:", err);
        showMsg("خطای API: " + err.message, "error");
      });
    }
  }, 1000);
}

  capturedFrame.style.display = "block";

  const formData = new FormData();
  formData.append("frame", file, file.name);

  fetch("http://localhost:5000/process_imgSetting", {
    method: "POST",

  })
    .then(response => response.json())
    .then(data => {
      if (data.warning[0] === "Face OK!") {

          showMsg(data.warning, "error");

    });
}

function saveImageToDB(base64Image) {
  fetch("http://localhost:5000/save_to_db2", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ image: base64Image })
  })

function showMsg(msg, type) {
  let box = document.getElementById("outputMsg");
  box.textContent = msg;
  box.className = "";
  box.classList.add(type ? type : "");
  box.classList.add("outputMsg");
}

function showMsgAllMessage(messages, type) {
  let box = document.getElementById("outputMsg");
  box.innerHTML = ""; // پاک کردن محتوای قبلی

  // اگر فقط یک پیام ساده (string) بود، آن را داخل آرایه می‌گذاریم
  if (!Array.isArray(messages)) {
    messages = [messages];
  }

  // چاپ هر پیام در یک <div>
  messages.forEach(msg => {
    const p = document.createElement("div");
    p.textContent = msg;
    p.className = type ? type : "";
    box.appendChild(p);
  });

  box.classList.add("outputMsg");
}
let currentStep = 1;
const totalSteps = 5; // تعداد کل مراحل

function goToNextStep() {
  if (currentStep >= totalSteps) {
    alert("این آخرین مرحله است!");
    return;
  }

  // غیرفعال کردن مرحله فعلی
  document.querySelector(`.step-indicator div:nth-child(${currentStep})`).classList.remove('active');
  
  // افزایش شماره مرحله
  currentStep++;
  
  // فعال کردن مرحله جدید
  document.querySelector(`.step-indicator div:nth-child(${currentStep})`).classList.add('active');
  
  // تغییر محتوای mainBox بر اساس مرحله فعلی
  updateMainBoxContent();
  
  // اگر به آخرین مرحله رسیدیم، متن دکمه را تغییر دهیم
  if (currentStep === totalSteps) {
    document.querySelector('.step-btn button').textContent = 'اتمام ✅';
  }
}

let fFile = null;
let sFile = null;
function previewFirstImage(event) {
  const file = event.target.files[0];
  fFile=file
  const preview = document.getElementById('firstPreview');
  const placeholder = document.getElementById('firstPlaceholder');
  
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      firstImage = e.target.result;
      preview.src = firstImage;
      preview.style.display = 'block';
      placeholder.style.display = 'none';
      checkCompareButton();
    };
    reader.readAsDataURL(file);
  }
}

function previewSecondImage(event) {
  const file = event.target.files[0];
  sFile = file;
  const preview = document.getElementById('secondPreview');
  const placeholder = document.getElementById('secondPlaceholder');
  
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      secondImage = e.target.result;
      preview.src = secondImage;
      preview.style.display = 'block';
      placeholder.style.display = 'none';
      checkCompareButton();
    };
    reader.readAsDataURL(file);
  }
}
function checkCompareButton() {
  const btn = document.getElementById('compareFacesBtn');
  btn.disabled = !(firstImage && secondImage);
}

 
async function compareFaces() {
  const btn = document.getElementById('compareFacesBtn');
  const resultBox = document.getElementById('matchResult');
  
  btn.innerHTML = '<span class="btn-icon">⏳</span> در حال پردازش...';
  
  try {
    // بررسی وجود فایل‌ها
    if (!fFile || !sFile) {
      throw new Error("لطفاً هر دو تصویر را انتخاب کنید");
    }

    const formData = new FormData();
    formData.append("file1", fFile, "image1.jpg");
    formData.append("file2", sFile, "image2.jpg");
    
 
    console.log("شروع پردازش...");
    console.log("فایل 1:", fFile);
    console.log("فایل 2:", sFile);
    
    // استفاده از await برای انتظار دریافت پاسخ
    const response = await fetch("http://176.126.120.73:8000/compare", {

      method: "POST",
      body: formData,
      mode: 'cors', // این خط را اضافه کنید
      headers: {
        'Accept': 'application/json',
      }
    });
    // console.log("پاسخ دریافت شد:", response);

    
    if (!response.ok) {
      const errorData = await response.json();
      // console.error("جزئیات خطا:", errorData);
      throw new Error(errorData.detail || "خطا در پردازش");
    }
    
    const data = await response.json();
    // console.log("داده‌های پردازش شده:", data);
    const similarityPercent = parseFloat(data.similarity_percent);
    
    // console.log("پاسخ API:", data); // برای دیباگ
    alert("میزان تشابه: " + similarityPercent + "%");
    
    document.getElementById('similarityScore').textContent = `${similarityPercent}%`;
    
    const threshold = parseFloat(document.getElementById('faceMatchThreshold').value);
    alert("آستانه:"+ (threshold*100)); // برای دیباگ
    const isMatch = similarityPercent >= (threshold * 100);
    
    const resultElement = document.getElementById('verificationResult');
    resultElement.textContent = isMatch ? 'تطابق دارد' : 'تطابق ندارد';
    resultElement.className = isMatch ? 'match' : 'no-match';
    
    resultBox.style.display = 'block';
    
  } catch (error) {
    // console.error("جزئیات خطا:", error);
    alert(`خطا: ${error.message}`) 
  } finally {
    btn.innerHTML = '<span class="btn-icon">🔍</span> مقایسه چهره‌ها';
  }
}
function goToPrevStep() {
      if (currentStep <= 1) return;
      
      document.querySelector(`.step-indicator div:nth-child(${currentStep})`).classList.remove('active');
      currentStep--;
      document.querySelector(`.step-indicator div:nth-child(${currentStep})`).classList.add('active');
      updateMainBoxContent();
      
      // تغییر متن دکمه به حالت عادی اگر از مرحله آخر برگشتیم
      document.querySelector('.step-btn button').textContent = 'مرحله بعد ⏭';
}
