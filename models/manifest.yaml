      1x3x192x192 RGB, RAW 0-255 pixels - the graph normalises internally
      (it starts with Sub/Mul nodes); crop = face box x1.5 about its centre
    sha256: f001b856447c413801ef5c42091ed0cd516fcd21f2d6b79635b1e733a7109dbf
    validation:
      note: >
        Points rendered on a test photo and checked by eye; eye indices
        (corners 35/39 and 89/93, lids 41-36, 40-33, 42-37 and 95-90,
