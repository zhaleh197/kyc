    task: face detection + 5 keypoints (SCRFD-10GF)
    source: buffalo_l/det_10g.onnx, unchanged
    license: non-commercial research only (InsightFace) - see note above
    input: 1x3x640x640 fixed, RGB, (x - 127.5) / 128, aspect-preserving resize into the top-left corner
    sha256: 5838f7fe053675b1c7a08b633df49e7af5495cee0493c7dcf6697200b85b5b91
    validation:
      note: >
        Smoke-checked on the 15 jpg test photos in phase1_facedetect/testPic
        and phase2_facematch/testimages: one face found in every photo
        (score 0.64-0.92). Not a benchmark.
      cpu_latency_ms: "~220-290 per frame on the dev machine (no AVX2) - over spec 02's proposed 150 ms; re-measure on the target server"
    known_limitations: >
      The fixed 640x640 input is the main cost; buffalo_s's det_500m is the
      smaller alternative if latency on the target CPU is a problem.

  - name: buffalo_l_2d106det.onnx
